apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-backend
  namespace: production
  labels:
    app: retail-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retail-backend
  template:
    metadata:
      labels:
        app: retail-backend
    spec:
      containers:
      - name: api
        image: umasankar33/backend:1
        ports:
        - containerPort: 8080
          name: api-port
        env:
        # 🔌 THE OVERRIDE: We construct an absolute URI string that enforces unencrypted database handshakes
        - name: DATABASE_URL
          value: "postgresql://dbadmin:ChangeThisValueViaParameterStoreOrESO@local-postgres-service.production.svc.cluster.local:5432/retail_prod?sslmode=disable"
        # Keep your existing individual variable tracks for safety handles
        - name: DB_HOST
          value: "local-postgres-service.production.svc.cluster.local"
        - name: DB_NAME
          value: "retail_prod"
        - name: PGSSLMODE
          value: "disable"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: DB_PASSWORD
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "150m"
            memory: "128Mi"