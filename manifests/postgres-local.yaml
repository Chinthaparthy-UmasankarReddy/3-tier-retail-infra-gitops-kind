apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: production
data:
  # 📝 Seeds your catalog data immediately when the database starts
  init.sql: |
    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        sku VARCHAR(50) UNIQUE NOT NULL,
        name VARCHAR(255) NOT NULL,
        description TEXT,
        price NUMERIC(10, 2) NOT NULL,
        image_url VARCHAR(512),
        category VARCHAR(100)
    );

    INSERT INTO products (sku, name, description, price, image_url, category) VALUES
    ('GROC-RICE-001', 'Premium Basmati Rice', 'Long-grain aromatic rice.', 149.00, 'https://images.unsplash.com/photo-1586201375761-83865001e31c', 'Groceries'),
    ('GROC-OIL-002', 'Organic Sunflower Oil', 'Pure cold-pressed oil.', 195.00, 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5', 'Groceries'),
    ('FRUIT-MNG-003', 'Fresh Alphonso Mangoes', 'Sweet seasonal mangoes.', 450.00, 'https://images.unsplash.com/photo-1553279768-865429fa0078', 'Fruits'),
    ('GROC-ATTA-004', 'Whole Wheat Atta (5kg)', 'High-fiber natural flour.', 260.00, 'https://images.unsplash.com/photo-1509440159596-0249088772ff', 'Groceries')
    ON CONFLICT (sku) DO NOTHING;

  # ⚙️ NGINX configuration to terminate SSL and proxy traffic to Postgres on localhost
  nginx-ssl-proxy.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log info;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    stream {
        server {
            listen 5432 ssl;
            proxy_pass 127.0.0.1:5433; # Forwards decrypted data to Postgres sitting on 5433

            ssl_certificate /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-postgres
  namespace: production
  labels:
    app: local-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-postgres
  template:
    metadata:
      labels:
        app: local-postgres
    spec:
      # 🛡️ An initContainer that creates standard dummy SSL certificates for NGINX (Not Postgres)
      initContainers:
      - name: proxy-cert-generator
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          apk add --no-cache openssl
          mkdir -p /etc/nginx/certs
          openssl req -new -x509 -days 3650 -nodes -text \
            -out /etc/nginx/certs/tls.crt \
            -keyout /etc/nginx/certs/tls.key \
            -subj "/CN=local-postgres-service"
        volumeMounts:
        - name: cert-vol
          mountPath: /etc/nginx/certs

      containers:
      # Container A: The NGINX SSL Proxy (Listens on standard port 5432 with SSL enabled)
      - name: ssl-proxy
        image: nginx:alpine
        ports:
        - containerPort: 5432
          name: proxy-port
        command: ["nginx", "-g", "daemon off;"]
        volumeMounts:
        - name: config-vol
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx-ssl-proxy.conf
        - name: cert-vol
          mountPath: /etc/nginx/certs

      # Container B: Vanilla Postgres Engine (Listens safely on port 5433 WITHOUT SSL)
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5433
          name: db-port
        env:
        - name: POSTGRES_DB
          value: "retail_prod"
        - name: POSTGRES_USER
          value: "dbadmin"
        - name: POSTGRES_PASSWORD
          value: "ChangeThisValueViaParameterStoreOrESO"
        command: ["docker-entrypoint.sh"]
        args: ["postgres", "-p", "5433"] # Shifts backend native execution port to 5433
        volumeMounts:
        - name: config-vol
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "150m"
            memory: "128Mi"

      volumes:
      - name: config-vol
        configMap:
          name: postgres-init-script
      - name: cert-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: local-postgres-service
  namespace: production
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: local-postgres