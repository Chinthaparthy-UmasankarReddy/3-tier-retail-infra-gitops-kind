apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: production
data:
  # 📝 This script executes automatically the exact millisecond the database initializes
  init.sql: |
    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        sku VARCHAR(50) UNIQUE NOT NULL,
        name VARCHAR(255) NOT NULL,
        description TEXT,
        price NUMERIC(10, 2) NOT NULL,
        image_url VARCHAR(512),
        category VARCHAR(100)
    );

    INSERT INTO products (sku, name, description, price, image_url, category) VALUES
    ('GROC-RICE-001', 'Premium Basmati Rice', 'Long-grain aromatic rice.', 149.00, 'https://images.unsplash.com/photo-1586201375761-83865001e31c', 'Groceries'),
    ('GROC-OIL-002', 'Organic Sunflower Oil', 'Pure cold-pressed oil.', 195.00, 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5', 'Groceries'),
    ('FRUIT-MNG-003', 'Fresh Alphonso Mangoes', 'Sweet seasonal mangoes.', 450.00, 'https://images.unsplash.com/photo-1553279768-865429fa0078', 'Fruits'),
    ('GROC-ATTA-004', 'Whole Wheat Atta (5kg)', 'High-fiber natural flour.', 260.00, 'https://images.unsplash.com/photo-1509440159596-0249088772ff', 'Groceries')
    ON CONFLICT (sku) DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-postgres
  namespace: production
  labels:
    app: local-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-postgres
  template:
    metadata:
      labels:
        app: local-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "retail_prod"
        - name: POSTGRES_USER
          value: "dbadmin"
        - name: POSTGRES_PASSWORD
          value: "ChangeThisValueViaParameterStoreOrESO"
        volumeMounts:
        - name: init-volume
          mountPath: /docker-entrypoint-initdb.d # 🚀 Native Postgres auto-execution folder
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: init-volume
        configMap:
          name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: local-postgres-service
  namespace: production
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: local-postgres