apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-postgres
  namespace: production
  labels:
    app: local-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-postgres
  template:
    metadata:
      labels:
        app: local-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "retail_prod"
        - name: POSTGRES_USER
          value: "dbadmin"
        - name: POSTGRES_PASSWORD
          value: "ChangeThisValueViaParameterStoreOrESO"
        # 🔧 FIX: Generate temporary self-signed SSL certs and start Postgres with SSL turned ON
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /tmp/pg_ssl
          cd /tmp/pg_ssl
          
          # Generate a private key and self-signed certificate instantly
          openssl req -new -x509 -days 365 -nodes -text -out server.crt \
            -keyout server.key -subj "/CN=local-postgres-service"
          
          # Postgres requires strict permissions on the private key file
          chmod 0600 server.key
          chown postgres:postgres server.key server.crt
          
          # Execute the standard entrypoint script with explicit SSL configuration flags
          exec docker-entrypoint.sh postgres \
            -c ssl=on \
            -c ssl_cert_file=/tmp/pg_ssl/server.crt \
            -c ssl_key_file=/tmp/pg_ssl/server.key
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: local-postgres-service
  namespace: production
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: local-postgres