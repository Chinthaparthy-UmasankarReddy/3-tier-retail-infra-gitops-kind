apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-postgres
  namespace: production
  labels:
    app: local-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-postgres
  template:
    metadata:
      labels:
        app: local-postgres
    spec:
      # 🚀 Completely removed initContainers to avoid root/999 user permission conflicts!
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "retail_prod"
        - name: POSTGRES_USER
          value: "dbadmin"
        - name: POSTGRES_PASSWORD
          value: "ChangeThisValueViaParameterStoreOrESO"
        command: ["/bin/sh", "-c"]
        args:
        - |
          # 1. Initialize the base database folder templates natively if they don't exist
          # This triggers the built-in docker entrypoint setup scripts as the postgres user safely
          docker-entrypoint.sh postgres &
          
          # 2. Wait a few seconds for the base ssl files (server.crt/key) to auto-generate natively 
          # during the container initialization phase (initdb)
          echo "Waiting for data directory parameters to initialize..."
          until [ -f /var/lib/postgresql/data/server.key ]; do sleep 1; done
          
          # 3. Stop the background process so we can re-launch with forced SSL execution bindings
          pg_ctl -D /var/lib/postgresql/data -m fast stop
          
          # 4. Execute the primary foreground process with explicit SSL requirements active
          echo "Launching database instance with SSL configuration active..."
          exec postgres -c ssl=on \
                        -c ssl_cert_file=/var/lib/postgresql/data/server.crt \
                        -c ssl_key_file=/var/lib/postgresql/data/server.key
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"