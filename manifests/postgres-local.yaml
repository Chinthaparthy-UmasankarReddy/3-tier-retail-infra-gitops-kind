apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-postgres
  namespace: production
  labels:
    app: local-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-postgres
  template:
    metadata:
      labels:
        app: local-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "retail_prod"
        - name: POSTGRES_USER
          value: "dbadmin"
        - name: POSTGRES_PASSWORD
          value: "ChangeThisValueViaParameterStoreOrESO"
        # 🔧 FIXED: Use standard postgres user to start up and read internal default configuration profiles
        command: ["docker-entrypoint.sh"]
        args:
        - "postgres"
        - "-c"
        - "ssl=on"
        # 🛡️ Pointing directly to the built-in, pre-generated internal fallback cert infrastructure
        - "-c"
        - "ssl_cert_file=/var/lib/postgresql/data/server.crt"
        - "-c"
        - "ssl_key_file=/var/lib/postgresql/data/server.key"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: local-postgres-service
  namespace: production
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: local-postgres